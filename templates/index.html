<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kronos Trading Signal Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5em;
            background: linear-gradient(120deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #888;
            font-size: 1.1em;
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: #16213e;
            border-radius: 10px;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        label {
            font-size: 0.9em;
            color: #aaa;
        }
        
        select, input {
            padding: 12px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #0f0f23;
            color: #fff;
            font-size: 1em;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #3a7bd5;
        }
        
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(120deg, #00d2ff, #3a7bd5);
            color: #fff;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(58, 123, 213, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .signal-card {
            background: #16213e;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        .signal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .signal-type {
            font-size: 2em;
            font-weight: bold;
            padding: 10px 30px;
            border-radius: 10px;
        }
        
        .signal-long {
            background: rgba(0, 200, 83, 0.2);
            color: #00c853;
            border: 2px solid #00c853;
        }
        
        .signal-short {
            background: rgba(255, 82, 82, 0.2);
            color: #ff5252;
            border: 2px solid #ff5252;
        }
        
        .signal-neutral {
            background: rgba(255, 255, 255, 0.1);
            color: #aaa;
            border: 2px solid #555;
        }
        
        .confidence {
            font-size: 1.5em;
            color: #3a7bd5;
        }
        
        .signal-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .detail-item {
            background: #0f0f23;
            padding: 20px;
            border-radius: 10px;
        }
        
        .detail-label {
            font-size: 0.9em;
            color: #888;
            margin-bottom: 5px;
        }
        
        .detail-value {
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .price-up {
            color: #00c853;
        }
        
        .price-down {
            color: #ff5252;
        }
        
        .reasons {
            background: #0f0f23;
            padding: 20px;
            border-radius: 10px;
        }
        
        .reasons h3 {
            margin-bottom: 15px;
            color: #3a7bd5;
        }
        
        .reason-item {
            padding: 10px 0;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .reason-item:last-child {
            border-bottom: none;
        }
        
        .reason-icon {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3a7bd5;
        }
        
        .kronos-prediction {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid #3a7bd5;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .kronos-prediction h3 {
            color: #3a7bd5;
            margin-bottom: 15px;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #888;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #333;
            border-top-color: #3a7bd5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            background: rgba(255, 82, 82, 0.2);
            border: 1px solid #ff5252;
            color: #ff5252;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .indicators-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .indicator-card {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
        }
        
        .indicator-card h4 {
            color: #3a7bd5;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        
        .indicator-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
        }
        
        .indicator-label {
            color: #888;
        }
        
        .indicator-value {
            font-weight: 600;
        }
        
        footer {
            text-align: center;
            padding: 30px 0;
            color: #555;
            border-top: 1px solid #333;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Kronos Trading Signal Generator</h1>
            <p class="subtitle">AI-Powered Trading Signals with Technical Analysis</p>
        </header>
        
        <div class="controls">
            <div class="control-group">
                <label>Trading Pair</label>
                <select id="symbol">
                    <option value="BTC-USDT">BTC/USDT</option>
                    <option value="ETH-USDT">ETH/USDT</option>
                    <option value="SOL-USDT">SOL/USDT</option>
                    <option value="XAU-USDT">XAU/USD (Gold)</option>
                    <option value="WTI-USDT">WTI (Oil)</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>Timeframe</label>
                <select id="timeframe">
                    <option value="5m">5 Minutes</option>
                    <option value="15m" selected>15 Minutes</option>
                    <option value="1H">1 Hour</option>
                    <option value="4H">4 Hours</option>
                    <option value="1D">1 Day</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>Lookback</label>
                <input type="number" id="lookback" value="400" min="100" max="1000">
            </div>
            
            <div class="control-group">
                <label>Prediction Length</label>
                <input type="number" id="predLen" value="6" min="1" max="50">
            </div>
            
            <div class="control-group" style="justify-content: flex-end;">
                <button class="btn-primary" id="generateBtn" onclick="generateSignal()">
                    Generate Signal
                </button>
            </div>
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="loading" class="loading" style="display: none;">
            <div class="loading-spinner"></div>
            <p>Analyzing market data...</p>
        </div>
        
        <div id="signalResult"></div>
        
        <div id="indicatorsResult" class="indicators-grid"></div>
        
        <footer>
            <p>Kronos Trading Signal Generator | Powered by AI</p>
        </footer>
    </div>
    
    <script>
        let config = null;
        
        // Load config on page load
        fetch('/api/config')
            .then(r => r.json())
            .then(data => {
                config = data;
                updateSymbolOptions();
            });
        
        function updateSymbolOptions() {
            if (!config || !config.trading_pairs) return;
            
            const select = document.getElementById('symbol');
            select.innerHTML = '';
            
            for (const [symbol, info] of Object.entries(config.trading_pairs)) {
                const option = document.createElement('option');
                option.value = symbol;
                option.textContent = `${info.name} (${symbol})`;
                select.appendChild(option);
            }
        }
        
        async function generateSignal() {
            const symbol = document.getElementById('symbol').value;
            const timeframe = document.getElementById('timeframe').value;
            const lookback = document.getElementById('lookback').value;
            const predLen = document.getElementById('predLen').value;
            
            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('signalResult').innerHTML = '';
            document.getElementById('error').style.display = 'none';
            document.getElementById('generateBtn').disabled = true;
            
            try {
                const response = await fetch('/api/signal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbol, timeframe, lookback: parseInt(lookback), pred_len: parseInt(predLen) })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    showError(data.error);
                } else {
                    displaySignal(data.signal);
                }
            } catch (err) {
                showError(err.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('generateBtn').disabled = false;
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function displaySignal(signal) {
            const typeClass = signal.type === 'long' ? 'signal-long' : 
                            signal.type === 'short' ? 'signal-short' : 'signal-neutral';
            
            const typeEmoji = signal.type === 'long' ? '🟢' : 
                            signal.type === 'short' ? '🔴' : '⚪';
            
            const reasonsHtml = signal.reasons.map(r => 
                `<div class="reason-item"><div class="reason-icon"></div>${r}</div>`
            ).join('');
            
            let kronosHtml = '';
            if (signal.kronos_prediction && signal.kronos_prediction.trend) {
                kronosHtml = `
                    <div class="kronos-prediction">
                        <h3>Kronos AI Prediction</h3>
                        <div class="signal-details">
                            <div class="detail-item">
                                <div class="detail-label">Predicted Trend</div>
                                <div class="detail-value ${signal.kronos_prediction.trend === 'up' ? 'price-up' : 'price-down'}">
                                    ${signal.kronos_prediction.trend.toUpperCase()}
                                </div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Predicted Change</div>
                                <div class="detail-value ${signal.kronos_prediction.change_pct >= 0 ? 'price-up' : 'price-down'}">
                                    ${signal.kronos_prediction.change_pct >= 0 ? '+' : ''}${signal.kronos_prediction.change_pct.toFixed(2)}%
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            const html = `
                <div class="signal-card">
                    <div class="signal-header">
                        <div>
                            <h2>${signal.symbol}</h2>
                            <p style="color: #888;">${new Date(signal.timestamp).toLocaleString()}</p>
                        </div>
                        <div class="signal-type ${typeClass}">
                            ${typeEmoji} ${signal.type.toUpperCase()}
                        </div>
                    </div>
                    
                    <div class="confidence">
                        Confidence: ${(signal.confidence * 100).toFixed(1)}%
                    </div>
                    
                    <div class="signal-details">
                        <div class="detail-item">
                            <div class="detail-label">Entry Price</div>
                            <div class="detail-value">$${signal.entry_price.toFixed(2)}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Stop Loss</div>
                            <div class="detail-value price-down">$${signal.stop_loss.toFixed(2)}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Take Profit</div>
                            <div class="detail-value price-up">$${signal.take_profit.toFixed(2)}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Risk/Reward</div>
                            <div class="detail-value">${signal.risk_reward_ratio.toFixed(2)}</div>
                        </div>
                    </div>
                    
                    <div class="reasons">
                        <h3>Analysis Reasons</h3>
                        ${reasonsHtml}
                    </div>
                    
                    ${kronosHtml}
                </div>
            `;
            
            document.getElementById('signalResult').innerHTML = html;
        }
        
        // Auto-refresh every 60 seconds
        setInterval(() => {
            if (document.getElementById('signalResult').innerHTML) {
                generateSignal();
            }
        }, 60000);
    </script>
</body>
</html>
